{
        var map = L.map('map', {
            zoomControl:false, maxZoom:24, minZoom:8,
            maxBounds: [
            [8.5,102.5], // góc Tây Nam (SouthWest)
            [23.5,110]  // góc Đông Bắc (NorthEast)
            ],
            maxBoundsViscosity: 1// độ “dính” khi kéo ra ngoài         
        })
        var hash = new L.Hash(map);

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        map.attributionControl.setPrefix(false);
        map.attributionControl.addAttribution("&copy; 2026 Victor Nguyen");

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);


        var bounds_group = new L.featureGroup([]);

        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
}

        //// Tạo nút button 
        let toggleBtn = L.control({position: 'topright'});
        toggleBtn.onAdd = function(map) {
            let div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
            div.style.cursor = 'pointer';
            div.style.backgroundColor = 'white';
            div.style.width = '40px';
            div.style.height = '40px';
            div.style.alignItems = 'center';
            div.style.lineHeight = '40px';
            div.style.justifyContent = 'center';
            div.style.display = 'flex';

            let img = L.DomUtil.create('img', '', div);
            img.src = 'new_legend/Chung/Layers.png'; 
            img.style.width = '30px';
            img.style.height = '30px';

            div.onclick = function(){
                let controlContainer = document.getElementsByClassName('leaflet-control-layers')[0];
                if (controlContainer.style.display === 'none') {
                    controlContainer.style.display = 'block';
                } else {
                    controlContainer.style.display = 'none';
                }
            };
            return div;
        };
        toggleBtn.addTo(map);
}

        cursor: pointer;
        object-fit: cover;
        transition: all 0.2s;
        }
        `;
        document.head.appendChild(style);

        // === Logic chuyển đổi layer khi click ===
        let currentBase = 'osm';

        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'basemap-btn') {

                    map.removeLayer(layer_OSM);
                    map.addLayer(layer_SAT);

                    currentBase = 'osm';
                }
            }
        });
